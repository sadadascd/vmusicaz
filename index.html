<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vmusicaz</title>
</head>

<body>

    <h1>🎵 Vmusicaz 🎵</h1>

    <!-- ========== CATEGORIA: CARRO ========== -->
    <div class="categoria-carro">
        <h2 class="titulo-categoria">🏎️ CARRO</h2>
        <h3>MARIO KART NA VIDA REAL!</h3>

        <div class="palco">
            <iframe
                width="100%"
                height="500"
                src="https://www.youtube.com/embed/hqgY8a39TiM"
                title="Mario Kart na vida real"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="botoes-acao">
            <button class="btn-like">👍 3.7K</button>
            <button class="btn-deslike">👎 15</button>
        </div>
    </div>

    <!-- ========== CATEGORIA: MÚSICA ========== -->
    <div class="categoria-musica">
        <h2 class="titulo-categoria">🎵 MÚSICA</h2>
        
        <!-- DESTAQUE DO MC JACARÉ -->
        <div class="artista-destaque">
            <span class="icone-artista">🐊</span>
            <span class="nome-artista">MC JACARÉ</span>
            <span class="icone-artista">🐊</span>
        </div>

        <h3>Quais os efeitos da aura</h3>

        <div class="palco">
            <iframe
                width="100%"
                height="500"
                src="https://www.youtube.com/embed/vTnBwT_hN5o"
                title="MC Jacaré"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="botoes-acao">
            <button class="btn-like">👍 2.4K</button>
            <button class="btn-deslike">👎 12</button>
        </div>
    </div>

    <!-- ========== CATEGORIA: COMÉDIA ========== -->
    <div class="categoria-comedia">
        <h2 class="titulo-categoria">😂 COMÉDIA</h2>
        <h3>Jazzghost - 7 ERROS</h3>

        <div class="palco">
            <iframe
                width="100%"
                height="500"
                src="https://www.youtube.com/embed/jfLcHITJZpQ"
                title="Jazzghost"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="botoes-acao">
            <button class="btn-like">👍 1.8K</button>
            <button class="btn-deslike">👎 8</button>
        </div>
    </div>

    <h2>MY LIFE</h2>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>© 2026 Vmusicaz - Criado por Epaminondas 🎵</p>
        <p class="rodape-pequeno">🎧 Feito com muito funk e código 🐊</p>
    </footer>

</body>

</html>
